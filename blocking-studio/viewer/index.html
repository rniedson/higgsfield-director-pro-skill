<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mannequin viewer</title>
<style>
  :root { --bg:#eef0f2; --fg:#1d2329; --panel:#ffffffee; --line:#d6dbe0; --accent:#2f6fde; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  #app { display:flex; height:100%; }
  #view { flex:1; min-width:0; position:relative; }
  #side { width:300px; overflow:auto; background:var(--panel); border-left:1px solid var(--line); padding:12px; box-sizing:border-box; }
  h1 { font-size:15px; margin:0 0 8px; }
  .info { font-size:12px; color:#56606b; white-space:pre-wrap; margin-bottom:10px; }
  button { font:inherit; margin:2px 4px 2px 0; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  details { border-top:1px solid var(--line); padding:4px 0; }
  summary { cursor:pointer; font-weight:600; font-size:13px; }
  label { display:grid; grid-template-columns:16px 1fr 40px; gap:6px; align-items:center; font-size:12px; }
  input[type=range] { width:100%; }
  @media (max-width:700px) { #app { flex-direction:column; } #side { width:auto; height:45%; border-left:0; border-top:1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="side">
    <h1>Mannequin in Three.js</h1>
    <div class="info" id="info">loading…</div>
    <div>
      <button id="btnPose">Test pose</button>
      <button id="btnZero">Reset</button>
      <button id="btnSkel">Skeleton</button>
    </div>
    <div>
      <button data-view="front">Front</button>
      <button data-view="three_quarter">3/4</button>
      <button data-view="side">Side</button>
      <button data-view="back">Back</button>
    </div>
    <div id="clips"></div>
    <div id="bones"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ?glb=<path> loads another file; the default is the approved mannequin
const params = new URLSearchParams(location.search);
const url = params.get('glb') || '../assets/characters/mannequin/mannequin.glb';
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeef0f2);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100); camera.position.set(1.6, 1.3, 3.6);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.9, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.GridHelper(4, 8, 0xb9c0c7, 0xd5dade));

let mixer = null, helper = null; const bones = []; const rest = new Map();
const clock = new THREE.Clock();
window.__mannequin = { ready: false };

new GLTFLoader().load(url, (gltf) => {
  const root = gltf.scene; scene.add(root);
  let tris = 0, meshes = 0, skinned = 0;
  root.traverse((o) => {
    if (o.isMesh) {
      meshes++; if (o.isSkinnedMesh) skinned++;
      o.castShadow = true;
      const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      o.material = new THREE.MeshStandardMaterial({ color: 0xa9adb2, roughness: 0.6, flatShading: true });
    }
    if (o.isBone) { bones.push(o); rest.set(o, o.quaternion.clone()); }
  });
  // feet on the floor, centred
  const box = new THREE.Box3().setFromObject(root);
  root.position.y -= box.min.y; root.position.x -= (box.min.x + box.max.x) / 2; root.position.z -= (box.min.z + box.max.z) / 2;
  const h = box.max.y - box.min.y;
  controls.target.set(0, h * 0.52, 0); camera.position.set(h * 0.9, h * 0.75, h * 2.1);
  helper = new THREE.SkeletonHelper(root); helper.visible = false; scene.add(helper);
  document.getElementById('info').textContent =
    `${url}\nheight ${h.toFixed(2)} m · ${Math.round(tris)} triangles\n${meshes} meshes (${skinned} skinned) · ${bones.length} bones · ${gltf.animations.length} clips`;
  if (gltf.animations.length) {
    mixer = new THREE.AnimationMixer(root);
    const box2 = document.getElementById('clips');
    gltf.animations.forEach((clip) => {
      const b = document.createElement('button'); b.textContent = '▶ ' + clip.name;
      b.onclick = () => { mixer.stopAllAction(); mixer.clipAction(clip).reset().play(); };
      box2.appendChild(b);
    });
  }
  buildBonePanel();
  window.__mannequin = { ready: true, url, tris: Math.round(tris), meshes, skinned, bones: bones.map(b => b.name), clips: gltf.animations.map(c => c.name), height: h };
}, undefined, (err) => { document.getElementById('info').textContent = 'could not load ' + url + '\n' + err; window.__mannequin = { ready: true, error: String(err) }; });

function buildBonePanel() {
  const host = document.getElementById('bones');
  bones.forEach((b) => {
    const d = document.createElement('details'); const s = document.createElement('summary'); s.textContent = b.name; d.appendChild(s);
    ['x', 'y', 'z'].forEach((ax) => {
      const l = document.createElement('label'); const r = document.createElement('input');
      r.type = 'range'; r.min = -180; r.max = 180; r.value = 0; const v = document.createElement('span'); v.textContent = '0';
      r.oninput = () => { v.textContent = r.value; applySliders(b, d); };
      l.append(ax.toUpperCase(), r, v); r.dataset.ax = ax; d.appendChild(l);
    });
    host.appendChild(d);
  });
}
function applySliders(b, d) {
  const e = { x: 0, y: 0, z: 0 };
  d.querySelectorAll('input').forEach((r) => (e[r.dataset.ax] = THREE.MathUtils.degToRad(+r.value)));
  b.quaternion.copy(rest.get(b)).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(e.x, e.y, e.z, 'XYZ')));
}
// turns a bone about a WORLD axis, so the test pose does not depend on each skeleton's local axes
function rotWorld(name, axis, deg) {
  const b = bones.find((x) => x.name.toLowerCase().includes(name)); if (!b) return false;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(...axis).normalize(), THREE.MathUtils.degToRad(deg));
  const pw = new THREE.Quaternion(); b.parent.getWorldQuaternion(pw);
  const bw = new THREE.Quaternion(); b.getWorldQuaternion(bw);
  const nw = q.multiply(bw); b.quaternion.copy(pw.invert().multiply(nw)); b.updateMatrixWorld(true); return true;
}
function zero() { bones.forEach((b) => b.quaternion.copy(rest.get(b))); document.querySelectorAll('#bones input').forEach((r) => { r.value = 0; r.nextSibling.textContent = '0'; }); }
function testPose() {
  if (mixer) mixer.stopAllAction(); zero();
  const tries = [];
  // bone names looked up per part, so the pose works on the sheet's skeleton and on an auto-rig (Mixamo-like names)
  const pick = (cands) => cands.find((c) => bones.some((b) => b.name.toLowerCase().includes(c)));
  const armL = pick(['upperarm_l', 'leftarm', 'arm_l', 'leftupperarm']), foreL = pick(['lowerarm_l', 'leftforearm', 'forearm_l']);
  const armR = pick(['upperarm_r', 'rightarm', 'arm_r', 'rightupperarm']), foreR = pick(['lowerarm_r', 'rightforearm', 'forearm_r']);
  const thighL = pick(['thigh_l', 'leftupleg', 'upleg_l', 'leftthigh']), calfL = pick(['calf_l', 'leftleg', 'shin_l', 'leftcalf']);
  const head = pick(['head']), spine = pick(['spine_02', 'spine02', 'spine1', 'spine']);
  // glTF faces +Z and +X is the character's left
  tries.push(rotWorld(armR, [1, 0, 0], -100), rotWorld(foreR, [1, 0, 0], -70));      // right arm forward, elbow bent
  tries.push(rotWorld(armL, [0, 0, 1], 45), rotWorld(foreL, [1, 0, 0], -40));         // left arm out to the side
  tries.push(rotWorld(thighL, [1, 0, 0], -70), rotWorld(calfL, [1, 0, 0], 90));       // knee up
  tries.push(rotWorld(head, [0, 1, 0], 30), rotWorld(spine, [0, 1, 0], -15));
  window.__mannequin.pose = { armL, foreL, armR, foreR, thighL, calfL, head, spine, ok: tries.filter(Boolean).length };
}
function setView(name) {
  const h = window.__mannequin.height || 1.75, d = h * 2.3, az = { front: 0, three_quarter: 40, side: 90, back: 180 }[name] ?? 0;
  const r = THREE.MathUtils.degToRad(az);
  controls.target.set(0, h * 0.52, 0); camera.position.set(Math.sin(r) * d, h * 0.62, Math.cos(r) * d); controls.update();
}
document.getElementById('btnPose').onclick = testPose;
document.getElementById('btnZero').onclick = () => { if (mixer) mixer.stopAllAction(); zero(); };
document.getElementById('btnSkel').onclick = () => { if (helper) helper.visible = !helper.visible; };
document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => setView(b.dataset.view)));
// world position of each bone, to check a pose without trusting the eye
window.boneWorldPositions = () => Object.fromEntries(bones.map((b) => { const p = new THREE.Vector3(); b.getWorldPosition(p); return [b.name, p.toArray().map((x) => +x.toFixed(3))]; }));
window.testPose = testPose; window.resetPose = zero; window.setView = setView;

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); if (mixer) mixer.update(dt); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
