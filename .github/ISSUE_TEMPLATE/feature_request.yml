name: Feature request
description: A new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problem
      description: What you are trying to direct or generate, and where the skill falls short.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposal
      description: What should change. A sample prompt or project JSON helps.
  - type: textarea
    id: alternativas
    attributes:
      label: Alternatives you considered
