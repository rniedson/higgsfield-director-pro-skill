# Deploys the static site in website/ to GitHub Pages.
name: Deploy static content to Pages

on:
  # Pushes to the default branch that change the site or this workflow
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in progress and the latest queued.
# Do not cancel in-progress runs, so that a deployment that started completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the website folder
          path: "./website"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
