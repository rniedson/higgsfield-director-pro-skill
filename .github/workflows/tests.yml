name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hfd:
    name: hfd.py · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 still has one
          - python: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only)
        working-directory: higgsfield-director
        run: python -m unittest discover -s tests -v

  repository:
    name: skill format and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PyYAML to read the frontmatter as real YAML
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Public/private boundary tests
        run: python -m unittest discover -s tools/tests -v
      - name: Repository and public/private boundary checks
        run: python tools/check_repo.py --require-yaml

  human-generator:
    name: human generator · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # Stops a sweep that hangs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # One command for each file: given together, `node --test` runs the files side by side, and the generator's
      # performance test (bounds in milliseconds per character) would be timed against the hand sweeps. Each step
      # runs even when an earlier one failed, so that one run reports every suite.
      - name: Generator tests (no dependencies)
        run: node --expose-gc --test blocking-studio/human-generator/tests/test_generator.mjs
      - name: Hand DNA contract tests
        if: ${{ !cancelled() }}
        run: node --expose-gc --test blocking-studio/human-generator/tests/test_hand_dna.mjs
      - name: Hand tests
        if: ${{ !cancelled() }}
        run: node --expose-gc --test blocking-studio/human-generator/tests/test_hands.mjs
      - name: hands/fit.js is what the fit tool writes for the current poses and mesh
        if: ${{ !cancelled() }}
        run: node blocking-studio/human-generator/tools/fit_hand_poses.mjs --check
