name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hfd:
    name: hfd.py · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 still has one
          - python: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only)
        working-directory: higgsfield-director
        run: python -m unittest discover -s tests -v

  repository:
    name: skill format and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PyYAML to read the frontmatter as real YAML
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Frontmatter, openai.yaml, JSON, links and anchors
        run: python tools/check_repo.py --require-yaml
